[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "if __name__ == __main__:",
]